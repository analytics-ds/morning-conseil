# Auteurs de Morning Conseil — multilingue FR/EN
# Lu nativement par Hugo via `.Site.Data.authors` (et `hugo.Data.authors`).
#
# L'ID (cle de la map) est utilise dans le frontmatter des articles : `author: camille-deshayes`
# `topics` sert a la selection automatique de l'auteur, `expertise` alimente knowsAbout du schema Person.

camille-deshayes:
  id: camille-deshayes
  name: Camille Deshayes
  type: person
  avatar: images/authors/camille-deshayes.jpg
  linkedinUrl: ""
  jobTitle:
    fr: Rédactrice en chef, immobilier de bureau
    en: Editor-in-chief, office real estate
  role:
    fr: Spécialiste location de bureaux et coworking
    en: Office rental and coworking specialist
  bio:
    fr: "Camille Deshayes suit le marché du bureau parisien depuis dix ans, d'abord côté conseil en immobilier d'entreprise puis comme journaliste. Elle a visité plus de 300 espaces à Paris et en Île-de-France. Sur Morning Conseil, elle décortique les baux flexibles, les grilles tarifaires au poste et les vrais coûts d'une implantation, arrondissement par arrondissement."
    en: "Camille Deshayes has followed the Paris office market for ten years, first in corporate real estate advisory and then as a journalist. She has visited more than 300 spaces in Paris and its region. On Morning Conseil, she breaks down flexible leases, price-per-desk grids and the real cost of setting up an office, district by district."
  expertise:
    - Location de bureaux
    - Coworking
    - Bail flexible et bail précaire
    - Budget au poste
    - Implantation à Paris
    - Immobilier d'entreprise
  topics:
