    - bail
    - loyer
    - prix au poste
    - budget
    - domiciliation
    - siege social
    - quartier
    - arrondissement
    - paris

antoine-riviere:
  id: antoine-riviere
  name: Antoine Rivière
  type: person
  avatar: images/authors/antoine-riviere.jpg
  linkedinUrl: ""
  jobTitle:
    fr: Journaliste aménagement et space planning
    en: Workspace design and space planning journalist
  role:
    fr: Spécialiste aménagement et salles de réunion
    en: Workspace design and meeting room specialist
  bio:
    fr: "Architecte d'intérieur de formation, Antoine Rivière écrit sur l'aménagement des espaces de travail depuis huit ans. Il s'intéresse autant aux ratios de surface par personne qu'à l'acoustique, à la lumière et au mobilier. Sur Morning Conseil, il traduit les règles du space planning en repères concrets pour dimensionner et équiper ses bureaux et ses salles de réunion."
    en: "Trained as an interior designer, Antoine Rivière has been writing about workspace design for eight years. He is as interested in floor area per person as in acoustics, lighting and furniture. On Morning Conseil, he turns space planning rules into practical benchmarks for sizing and equipping offices and meeting rooms."
  expertise:
    - Space planning
    - Aménagement de bureaux
    - Salles de réunion
    - Acoustique et lumière
    - Mobilier de bureau
    - Ergonomie au travail
  topics:
