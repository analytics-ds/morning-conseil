    - bureau ferme
    - visio
    - phone box
    - surface
    - m2
    - decoration
    - agencement

helene-morvan:
  id: helene-morvan
  name: Hélène Morvan
  type: person
  avatar: images/authors/helene-morvan.jpg
  linkedinUrl: ""
  jobTitle:
    fr: Cheffe de projet événementiel d'entreprise
    en: Corporate events project manager
  role:
    fr: Spécialiste événements d'entreprise et organisation du travail
    en: Corporate events and ways of working specialist
  bio:
    fr: "Hélène Morvan a organisé une centaine de séminaires, conventions et soirées d'entreprise avant de passer à l'écriture. Elle connaît les contraintes techniques d'un lieu privatisé comme les points de bascule d'un budget. Sur Morning Conseil, elle couvre l'organisation d'événements et les méthodes d'organisation du travail : rituels d'équipe, concentration et rythme de la semaine."
    en: "Hélène Morvan organised around a hundred offsites, conventions and company parties before turning to writing. She knows the technical constraints of a private venue as well as the tipping points of a budget. On Morning Conseil, she covers event planning and ways of working: team rituals, focus and weekly rhythm."
