# Roadmap editoriale evergreen — Morning Conseil (morning-conseil)
#
# Blog : https://conseil.morning.fr/
# Langue principale : fr (+ EN auto dans /en/)
# Categories disponibles (doivent matcher hugo.toml) :
#   - Location de bureaux
#   - Coworking
#   - Salle de reunion
#   - Organisation evenement
#   - Amenagement
#   - Productivite
#
# FONCTIONNEMENT
# --------------
# L'agent prend la premiere entree avec status: todo et scheduled_date <= today.
# Il genere l'article FR + EN et push sur main. GitHub Actions deploie.
# En cas d'echec, status passe a failed et error est rempli (voir notes dans
# .claude/templates/roadmap-template.yaml).
#
# AJOUT D'UNE ENTREE
# ------------------
# Copier un bloc, remplir kw / category / scheduled_date, laisser les autres
# champs tels quels. Respecter l'orthographe exacte d'une categorie ci-dessus.
#
# Frequence cible sur ce blog : 4 articles/semaine maximum (regle du reseau).

articles:
  - kw: "domiciliation entreprise paris"
    category: "Location de bureaux"
    scheduled_date: "2026-09-04"
    status: done
    published_date: "2026-09-04"
    published_url_fr: "https://conseil.morning.fr/blog/domiciliation-entreprise-paris/"
    published_url_en: "https://conseil.morning.fr/en/blog/company-registered-address-paris/"
    error: null

  - kw: "budget team building"
    category: "Organisation evenement"
    scheduled_date: "2026-09-07"
    status: done
    published_date: "2026-09-07"
    published_url_fr: "https://conseil.morning.fr/blog/budget-team-building/"
    published_url_en: "https://conseil.morning.fr/en/blog/team-building-budget-per-person/"
    error: null

