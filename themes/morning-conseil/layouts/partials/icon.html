{{- /* Icones de thematique du mega menu et des listings.
       Appel : {{ partial "icon.html" "building" }}
       Trait blanc herite via currentColor, pose sur les bulles de couleur. */ -}}
{{- $name := . -}}
<svg class="icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{{- if eq $name "building" -}}
<rect x="4" y="3" width="12" height="14" rx="1"/><path d="M7.5 6.5h1.5M11 6.5h1.5M7.5 9.5h1.5M11 9.5h1.5"/><path d="M8.5 17v-3.5h3V17"/>
{{- else if eq $name "users" -}}
<circle cx="8" cy="7.2" r="2.6"/><path d="M3.4 16.6c0-2.6 2.1-4.3 4.6-4.3s4.6 1.7 4.6 4.3"/><path d="M13.4 5.9a2.4 2.4 0 010 4.6"/><path d="M14.6 12.5c1.3.6 2.1 2 2.1 4.1"/>
{{- else if eq $name "screen" -}}
<rect x="3" y="4" width="14" height="9" rx="1"/><path d="M7 16.5h6M10 13v3.5"/>
{{- else if eq $name "calendar" -}}
<rect x="3.5" y="5" width="13" height="11.5" rx="1.5"/><path d="M3.5 8.5h13M7 3.5v3M13 3.5v3"/>
{{- else if eq $name "layout" -}}
<rect x="3.5" y="3.5" width="13" height="13" rx="1.5"/><path d="M3.5 8.5h13M9.5 8.5v8"/>
{{- else if eq $name "clock" -}}
<circle cx="10" cy="10" r="6.5"/><path d="M10 6.2V10l2.6 2"/>
{{- else -}}
<circle cx="10" cy="10" r="6.5"/>
{{- end -}}
</svg>
