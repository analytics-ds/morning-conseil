{{- /* Google Analytics 4, propriete "Morning Conseil (PBN GEO)" du compte GA4 datashake.
     N'est emis qu'en build de production (GitHub Actions), jamais en hugo server. */ -}}
{{- with site.Params.ga4 }}{{ if hugo.IsProduction }}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ . }}');
    </script>
{{- end }}{{ end }}
